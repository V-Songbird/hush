<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 206" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .title{fill:#1f2937;font-size:17px;font-weight:700}
    .sub{fill:#6b7280;font-size:12.5px}
    .item{fill:#374151;font-size:13.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .hushitem{fill:#059669;font-size:13.5px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .amt{fill:#374151;font-size:13.5px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .hushamt{fill:#059669;font-size:14px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .rule{stroke:#d7dde4;stroke-width:1}
    .note{fill:#9aa3ad;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .tot{fill:#1f2937;font-size:14px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .foot{fill:#6b7280;font-size:12.5px}.em{fill:#059669;font-weight:700}
    @media (prefers-color-scheme:dark){
      .title{fill:#e6edf3}.sub{fill:#9198a1}.item{fill:#c9d1d9}.hushitem{fill:#3fb950}
      .amt{fill:#c9d1d9}.hushamt{fill:#3fb950}.rule{stroke:#30363d}.note{fill:#6e7681}.tot{fill:#e6edf3}.foot{fill:#9198a1}.em{fill:#3fb950}
    }
  </style>
  <text x="16" y="28" class="title">Where a real session&#8217;s money goes</text>
  <text x="16" y="50" class="sub">One average session from the suite, itemised</text>

  <text x="16" y="92" class="item">what Claude read</text>
  <text x="250" y="92" class="note">files, logs, command output</text>
  <text x="704" y="92" class="amt" text-anchor="end">$0.186</text>

  <text x="16" y="120" class="item">what Claude wrote back</text>
  <text x="250" y="120" class="note">the reply</text>
  <text x="704" y="120" class="amt" text-anchor="end">$0.026</text>

  <line x1="16" y1="140" x2="704" y2="140" class="rule"/>

  <text x="16" y="164" class="tot">the session</text>
  <text x="704" y="164" class="tot" text-anchor="end">$0.211</text>

  <text x="16" y="196" class="foot">A plugin that only shortens the reply is working on the <tspan class="em">$0.026</tspan>. hush works on the line above it too.</text>
</svg>
