<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .title{fill:#1f2937;font-size:18px;font-weight:700}
    .sub{fill:#6b7280;font-size:13px}
    .reads{fill:#6366f1}.reply{fill:#10b981}
    .onbar{fill:#ffffff;font-size:13px;font-weight:600}
    .replylab{fill:#059669;font-size:12.5px;font-weight:700}
    .replysub{fill:#6b7280;font-size:11.5px}
    .foot{fill:#6b7280;font-size:12.5px}.em{fill:#059669;font-weight:700}.badge{fill:#6366f1}
    @media (prefers-color-scheme:dark){
      .title{fill:#e6edf3}.sub{fill:#9198a1}.reads{fill:#7c8cf8}.reply{fill:#3fb950}
      .replylab{fill:#3fb950}.replysub{fill:#9198a1}.foot{fill:#9198a1}.em{fill:#3fb950}.badge{fill:#4f46e5}
    }
  </style>
  <text x="16" y="30" class="title">Where a real session&#8217;s money goes</text>
  <text x="16" y="52" class="sub">Almost the whole bill is what Claude reads — files, logs, command output — not the reply</text>

  <rect x="596" y="12" width="116" height="34" rx="17" class="badge"/>
  <text x="654" y="35" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">21 : 1</text>

  <rect x="16" y="74" width="657" height="34" rx="6" class="reads"/>
  <rect x="677" y="74" width="27" height="34" rx="6" class="reply"/>
  <text x="30" y="96" class="onbar">what Claude reads — files, logs, command output</text>

  <line x1="690" y1="112" x2="690" y2="124" stroke="#10b981" stroke-width="2"/>
  <text x="704" y="140" text-anchor="end" class="replylab">the reply — under 5%</text>
  <text x="704" y="157" text-anchor="end" class="replysub">a &#8220;just be brief&#8221; plugin can only trim this</text>

  <text x="16" y="182" class="foot"><tspan class="em">hush works on the other 95%</tspan> — noisy output and bulky logs, trimmed before they hit your bill.</text>
</svg>
