<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 208" font-family="Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <text x="8" y="24" font-size="15" font-weight="600" fill="#8b949e">What a real engineering session actually bills for</text>
  <rect x="598" y="4" width="74" height="34" rx="17" fill="#5b7cd6"/>
  <text x="635" y="27" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">154:1</text>
  <rect x="8" y="52" width="651" height="34" rx="3" fill="#5b7cd6"/>
  <rect x="661" y="52" width="6" height="34" rx="2" fill="#16a34a"/>
  <text x="20" y="74" font-size="13" font-weight="600" fill="#ffffff">what the session reads &#8212; files, logs, command output, context</text>
  <text x="645" y="74" text-anchor="end" font-size="13" font-weight="700" fill="#ffffff">99%</text>
  <line x1="664" y1="90" x2="664" y2="102" stroke="#16a34a" stroke-width="1.5"/>
  <text x="672" y="116" text-anchor="end" font-size="13" font-weight="700" fill="#16a34a">the reply you read &#8212; under 1%</text>
  <text x="672" y="136" text-anchor="end" font-size="12" fill="#8b949e">a "just be brief" plugin can only trim this sliver</text>
  <text x="8" y="162" font-size="13" font-weight="600" fill="#5b7cd6">hush works on the other 99% too &#8212; noisy output capped, bulky logs compressed, before they hit your bill</text>
  <text x="8" y="190" font-size="11" fill="#8b949e">In our benchmark sessions Claude read 154&#215; more than it wrote &#8212; measured from the API&#8217;s own usage data</text>
</svg>
