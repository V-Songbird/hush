<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Four checks of the final message from one batch on Claude Opus 5.5, September 28, 2026: nine jobs, 36 sessions with Hush and 36 without. It measures the voice released as 1.13.0, not the current one. Higher is better: a fresh reader answered all three questions, what happened, what to open and what to do next, for 100% of Hush answers and 94.4% without; the answer linked the file with a line number in 29 of 36 Hush sessions and 0 of 36 without. Lower is better: words sitting in blocks over 40 words, 52.3% with Hush and 78.3% without; sentences over 20 words, 0.5% with Hush and 10.9% without. It reads: Built to be read. Not perfect: half of Hush's words still sat in long blocks."><style>.bg{fill:#f2f1ec}.bg{stroke:rgba(20,20,19,.14)}.ink{fill:#161612}.mut{fill:#6d6a60}.wv{fill:#8f8b80}.nd{fill:#2c75a5}.id{fill:#2c75a5}@media(prefers-color-scheme:dark){.bg{fill:#141413}.bg{stroke:#30363d}.ink{fill:#ffffff}.mut{fill:#b9b9b1}.wv{fill:#8f8b80}.nd{fill:#79b6de}.id{fill:#79b6de}}.card,.bg{fill:#fff}.ink-frame{stroke:#252820;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.seal{stroke:#252820}.seal-paper{fill:#fff}text{font-kerning:normal;text-rendering:optimizeLegibility}@media(prefers-color-scheme:dark){.card,.bg{fill:#191c1b}.ink-frame{stroke:#eee9de}.seal{stroke:#eee9de}.seal-paper{fill:#191c1b}}</style><path class="bg ink-frame" d="M12 1 Q252 -2 688 1 Q699 0 699 12 L698 360 Q700 371 688 371 Q336 374 12 371 Q1 372 1 360 L2 12 Q0 1 12 1Z"/><text class="id" x="330" y="38" font-size="13" font-weight="700">with Hush</text><text class="mut" x="520" y="38" font-size="13">without</text><text class="mut" x="24" y="64" font-size="12.5">Higher is better</text><text class="ink" x="40" y="88" font-size="14.5">A fresh reader answered all three</text><rect class="nd" x="330" y="77" width="100" height="12" rx="3"/><text class="id" x="438" y="88" font-size="12.5" font-weight="700">100%</text><rect class="wv" x="520" y="77" width="94.4" height="12" rx="3"/><text class="mut" x="628" y="88" font-size="12.5">94.4%</text><text class="ink" x="40" y="112" font-size="14.5">Answer linked the file and its line</text><rect class="nd" x="330" y="101" width="80.6" height="12" rx="3"/><text class="id" x="438" y="112" font-size="12.5" font-weight="700">29 of 36</text><text class="mut" x="520" y="112" font-size="12.5">0 of 36</text><text class="mut" x="24" y="142" font-size="12.5">Lower is better</text><text class="ink" x="40" y="166" font-size="14.5">Words in blocks over 40 words</text><rect class="nd" x="330" y="155" width="52.3" height="12" rx="3"/><text class="id" x="438" y="166" font-size="12.5" font-weight="700">52.3%</text><rect class="wv" x="520" y="155" width="78.3" height="12" rx="3"/><text class="mut" x="628" y="166" font-size="12.5">78.3%</text><text class="ink" x="40" y="190" font-size="14.5">Sentences over 20 words</text><rect class="nd" x="330" y="179" width="0.5" height="12"/><text class="id" x="438" y="190" font-size="12.5" font-weight="700">0.5%</text><rect class="wv" x="520" y="179" width="10.9" height="12" rx="3"/><text class="mut" x="628" y="190" font-size="12.5">10.9%</text><text class="ink" x="24" y="256" font-size="46" font-weight="800" letter-spacing="-1">Built to be read.</text><text class="mut" x="24" y="284" font-size="14">The three questions: what happened, what to open, what to do next. The reader was a fresh</text><text class="mut" x="24" y="302" font-size="14">Claude session that saw only the request and the final message.</text><text class="mut" x="24" y="324" font-size="14">Not perfect: half of Hush's words still sat in long blocks.</text><text class="mut" x="24" y="350" font-size="14">Claude Opus 5.5, September 28, 2026. 36 sessions each. Voice 1.13.0, not the current one.</text><g transform="translate(628 238) rotate(-8) translate(-32 -32) scale(0.5)" aria-hidden="true"><g class="seal" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M64 15Q100 14 111 43Q118 70 102 94Q86 114 60 112Q30 112 19 88Q10 62 22 38Q36 16 64 15Z" fill="#2c75a5"/><path d="M79 38A30 30 0 1 0 91 88A24 24 0 1 1 79 38Z" class="seal-paper"/></g></g></svg>
