<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .title{fill:#1f2937;font-size:17px;font-weight:700}
    .sub{fill:#6b7280;font-size:12.5px}
    .item{fill:#374151;font-size:13.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .hushitem{fill:#059669;font-size:13.5px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .amt{fill:#374151;font-size:13.5px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .hushamt{fill:#059669;font-size:14px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .rule{stroke:#d7dde4;stroke-width:1}
    .foot{fill:#6b7280;font-size:12.5px}.em{fill:#059669;font-weight:700}
    @media (prefers-color-scheme:dark){
      .title{fill:#e6edf3}.sub{fill:#9198a1}.item{fill:#c9d1d9}.hushitem{fill:#3fb950}
      .amt{fill:#c9d1d9}.hushamt{fill:#3fb950}.rule{stroke:#30363d}.foot{fill:#9198a1}.em{fill:#3fb950}
    }
  </style>
  <text x="16" y="28" class="title">A multi-turn debugging session</text>
  <text x="16" y="50" class="sub">Triage an outage, dig the version out of a huge lockfile, then write the handoff</text>

  <text x="16" y="92" class="item">no plugin</text>
  <text x="704" y="92" class="amt" text-anchor="end">$0.43</text>

  <text x="16" y="120" class="item">a &#8220;be brief&#8221; plugin</text>
  <text x="704" y="120" class="amt" text-anchor="end">$0.42</text>

  <text x="16" y="148" class="item">an &#8220;efficiency mode&#8221; plugin</text>
  <text x="704" y="148" class="amt" text-anchor="end">$0.41</text>

  <text x="16" y="176" class="hushitem">hush</text>
  <text x="704" y="176" class="hushamt" text-anchor="end">$0.28</text>

  <line x1="16" y1="196" x2="704" y2="196" class="rule"/>

  <text x="16" y="220" class="item">what hush takes off the bill</text>
  <text x="704" y="220" class="hushamt" text-anchor="end">$0.15</text>

  <text x="16" y="240" class="foot">The lockfile never floods the chat &#8212; hush keeps a tidy summary and the full copy one click away.</text>
</svg>
