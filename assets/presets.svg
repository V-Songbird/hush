<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 501" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="One answer under three Hush presets, as the preview of the /hush:config configurator shows it in hush 2.6.6. Minimal, 22 words: the next-step box is the whole reply, with a two-sentence recap and the question, Shall I commit the fix. Standard, 103 words: two file cards, the bold result, the cause, the change, the checks in one sentence, what was not checked, a recommendation, the records, a footnote for the term token, and the Next line. Explainer, 118 words: the same answer with the term explained in place, two more sentences on the change, no Next line, and the box's question. It reads: One answer, three presets."><style>.bg{fill:#f2f1ec}.bg{stroke:rgba(20,20,19,.14)}.card{fill:#ffffff}.pill{fill:none;stroke:#8f8b80}.ink{fill:#161612}.mut{fill:#6d6a60}.id{fill:#2c75a5}@media(prefers-color-scheme:dark){.bg{fill:#141413}.bg{stroke:#30363d}.card{fill:#191c1b}.ink{fill:#ffffff}.mut{fill:#b9b9b1}.id{fill:#79b6de}}.card,.bg{fill:#fff}.ink-frame{stroke:#252820;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.seal{stroke:#252820}.seal-paper{fill:#fff}text{font-kerning:normal;text-rendering:optimizeLegibility}@media(prefers-color-scheme:dark){.card,.bg{fill:#191c1b}.ink-frame{stroke:#eee9de}.seal{stroke:#eee9de}.seal-paper{fill:#191c1b}}</style><path class="bg ink-frame" d="M12 1 Q252 -2 688 1 Q699 0 699 12 L698 489 Q700 500 688 500 Q336 503 12 500 Q1 501 1 489 L2 12 Q0 1 12 1Z"/><text class="ink" x="24" y="34" font-size="17" font-weight="700">One answer, three presets</text><text class="mut" x="24" y="52" font-size="11.5">The preview in /hush:config, word for word.</text><text class="id" x="26" y="80" font-size="13" font-weight="700">minimal</text><text class="mut" x="218" y="80" font-size="11" text-anchor="end">22 words</text><text class="id" x="254" y="80" font-size="13" font-weight="700">standard</text><text class="mut" x="446" y="80" font-size="11" text-anchor="end">103 words</text><text class="id" x="482" y="80" font-size="13" font-weight="700">explainer</text><text class="mut" x="674" y="80" font-size="11" text-anchor="end">118 words</text><path class="card ink-frame" d="M26 89 Q91.75999999999999 86 218 89 Q229 88 229 100 L228 475 Q230 486 218 486 Q117.67999999999999 489 26 486 Q15 487 15 475 L16 100 Q14 89 26 89Z"/><path class="card ink-frame" d="M254 89 Q319.76 86 446 89 Q457 88 457 100 L456 475 Q458 486 446 486 Q345.68 489 254 486 Q243 487 243 475 L244 100 Q242 89 254 89Z"/><path class="card ink-frame" d="M482 89 Q547.76 86 674 89 Q685 88 685 100 L684 475 Q686 486 674 486 Q573.68 489 482 486 Q471 487 471 475 L472 100 Q470 89 482 89Z"/><text class="mut" x="26" y="110" font-size="10">The box is the whole reply. No message</text><text class="mut" x="26" y="124.5" font-size="10">follows it.</text><text class="ink" x="26" y="146" font-size="11">The login passes again with a one-line</text><text class="ink" x="26" y="160.5" font-size="11">change. The browser check and the</text><text class="ink" x="26" y="175" font-size="11">commit are still missing.</text><text class="id" x="26" y="196.5" font-size="11" font-weight="700">Shall I commit the fix?</text><path class="pill ink-frame" d="M32 207 Q54.08 205.1 98 207 Q103 206 103 212 L102 218 Q104 223 98 223 Q63.44 224.9 32 223 Q27 224 27 218 L28 212 Q26 207 32 207Z"/><text class="id" x="34" y="219" font-size="10" font-weight="700">Yes, commit</text><path class="pill ink-frame" d="M118 207 Q131.8 205.1 161 207 Q166 206 166 212 L165 218 Q167 223 161 223 Q138.4 224.9 118 223 Q113 224 113 218 L114 212 Q112 207 118 207Z"/><text class="id" x="120" y="219" font-size="10" font-weight="700">Not now</text><path class="pill ink-frame" d="M260 99 Q287.84 97.1 342 99 Q347 98 347 104 L346 110 Q348 115 342 115 Q299.12 116.9 260 115 Q255 116 255 110 L256 104 Q254 99 260 99Z"/><text class="mut" x="262" y="111" font-size="10">expiry.test.js</text><path class="pill ink-frame" d="M362 99 Q385.88 97.1 433 99 Q438 98 438 104 L437 110 Q439 115 433 115 Q395.84 116.9 362 115 Q357 116 357 110 L358 104 Q356 99 362 99Z"/><text class="mut" x="364" y="111" font-size="10">login-fix.md</text><text class="ink" x="254" y="134.5" font-size="11" font-weight="700">The login test passes again.</text><text class="ink" x="254" y="156" font-size="11">verifyToken read the expiry as text.</text><text class="ink" x="254" y="170.5" font-size="11">Every token¹ looked expired.</text><text class="ink" x="254" y="192" font-size="11">I changed one line in auth.js:58 and</text><text class="ink" x="254" y="206.5" font-size="11">added expiry.test.js.</text><text class="ink" x="254" y="228" font-size="11">npm test passes: 212 passed, 0 failed,</text><text class="ink" x="254" y="242.5" font-size="11">0 skipped. npm run lint passes.</text><text class="ink" x="254" y="264" font-size="11">I did not try a real login in the</text><text class="ink" x="254" y="278.5" font-size="11">browser. The e2e tests did not run.</text><text class="ink" x="254" y="293" font-size="11">Nor did I check the dark theme of the</text><text class="ink" x="254" y="307.5" font-size="11">error screen.</text><text class="ink" x="254" y="329" font-size="11">I recommend adding a test for expired</text><text class="ink" x="254" y="343.5" font-size="11">tokens.</text><text class="ink" x="254" y="365" font-size="11">I wrote the details in login-fix.md.</text><text class="ink" x="254" y="379.5" font-size="11">The output is in the npm test tab.</text><text class="mut" x="254" y="401" font-size="10">¹ token: the credential that proves</text><text class="mut" x="254" y="415.5" font-size="10">you signed in.</text><text class="ink" x="254" y="437" font-size="11">Next: read auth.js:58 and tell me</text><text class="ink" x="254" y="451.5" font-size="11">whether to commit.</text><path class="pill ink-frame" d="M488 99 Q515.84 97.1 570 99 Q575 98 575 104 L574 110 Q576 115 570 115 Q527.12 116.9 488 115 Q483 116 483 110 L484 104 Q482 99 488 99Z"/><text class="mut" x="490" y="111" font-size="10">expiry.test.js</text><path class="pill ink-frame" d="M590 99 Q613.88 97.1 661 99 Q666 98 666 104 L665 110 Q667 115 661 115 Q623.84 116.9 590 115 Q585 116 585 110 L586 104 Q584 99 590 99Z"/><text class="mut" x="592" y="111" font-size="10">login-fix.md</text><text class="ink" x="482" y="134.5" font-size="11" font-weight="700">The login test passes again.</text><text class="ink" x="482" y="156" font-size="11">verifyToken read the expiry as text.</text><text class="ink" x="482" y="170.5" font-size="11">Every token looked expired. A token is</text><text class="ink" x="482" y="185" font-size="11">the credential that proves you signed</text><text class="ink" x="482" y="199.5" font-size="11">in.</text><text class="ink" x="482" y="221" font-size="11">I changed one line in auth.js:58 and</text><text class="ink" x="482" y="235.5" font-size="11">added expiry.test.js. The expiry</text><text class="ink" x="482" y="250" font-size="11">arrived as text and was compared with</text><text class="ink" x="482" y="264.5" font-size="11">a number. I ruled out the server</text><text class="ink" x="482" y="279" font-size="11">clock.</text><text class="ink" x="482" y="300.5" font-size="11">npm test passes: 212 passed, 0 failed,</text><text class="ink" x="482" y="315" font-size="11">0 skipped. npm run lint passes.</text><text class="ink" x="482" y="336.5" font-size="11">I did not try a real login in the</text><text class="ink" x="482" y="351" font-size="11">browser. The e2e tests did not run.</text><text class="ink" x="482" y="365.5" font-size="11">Nor did I check the dark theme of the</text><text class="ink" x="482" y="380" font-size="11">error screen.</text><text class="ink" x="482" y="401.5" font-size="11">I recommend adding a test for expired</text><text class="ink" x="482" y="416" font-size="11">tokens.</text><text class="ink" x="482" y="437.5" font-size="11">I wrote the details in login-fix.md.</text><text class="ink" x="482" y="452" font-size="11">The output is in the npm test tab.</text><text class="id" x="482" y="473.5" font-size="11" font-weight="700">Shall I commit the fix?</text><g transform="translate(655 36) rotate(-6) translate(-20 -20) scale(0.3125)" aria-hidden="true"><g class="seal" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M64 15Q100 14 111 43Q118 70 102 94Q86 114 60 112Q30 112 19 88Q10 62 22 38Q36 16 64 15Z" fill="#2c75a5"/><path d="M79 38A30 30 0 1 0 91 88A24 24 0 1 1 79 38Z" class="seal-paper"/></g></g></svg>
