<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="What hush cuts, averaged per session over the same 17 jobs on Sonnet. Tool output: no plugin 16.7k characters, hush 6.8k, 59% less. Chatter before the answer: 41 words against 0.8 words, 98% less. Tokens the model wrote: 1,659 against 1,373, 17% less. Cost per session: $0.185 against $0.179, 3% less, which sits inside run-to-run noise."><style>.card{fill:#fcfcfb}.card{stroke:rgba(11,11,11,.07)}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.bp{fill:#dcd9d0}.cw{fill:#e3f2e3}.cwt{fill:#0a6b0a}.cf{fill:#f0efeb}.cft{fill:#52514e}.ac{fill:#2a78d6}@media(prefers-color-scheme:dark){.card{fill:#161b22}.card{stroke:#30363d}.ink{fill:#e6edf3}.ink2{fill:#b0b8c0}.mut{fill:#9198a1}.bp{fill:#3d3c37}.cw{fill:#17301f}.cwt{fill:#3fb950}.cf{fill:#2b2b29}.cft{fill:#9198a1}.ac{fill:#4c9be8}}</style><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b0b0b" flood-opacity=".10"/></filter><rect class="card" x="8" y="6" width="684" height="304" rx="18" filter="url(#s)"/><text class="ink" x="36" y="46" font-size="21" font-weight="800">What hush cuts</text><text class="mut" x="36" y="68" font-size="14.5">average per session on the same 17 jobs &#8212; gray is no plugin, blue is hush</text><text class="ink" x="36" y="111" font-size="15.5" font-weight="600">tool output</text><rect class="bp" x="196" y="90" width="250" height="14" rx="7"/><text class="ink2" x="560" y="102" font-size="13.5" text-anchor="end">16.7k chars</text><rect class="ac" x="196" y="108" width="101.8" height="14" rx="7"/><text class="ink2" x="560" y="120" font-size="13.5" text-anchor="end">6.8k chars</text><rect class="cw" x="602" y="93" width="56" height="26" rx="13"/><text class="cwt" x="630" y="111" font-size="14.5" font-weight="800" text-anchor="middle">&#8722;59%</text><text class="ink" x="36" y="157" font-size="15.5" font-weight="600">mid-work chatter</text><rect class="bp" x="196" y="136" width="250" height="14" rx="7"/><text class="ink2" x="560" y="148" font-size="13.5" text-anchor="end">41 words</text><rect class="ac" x="196" y="154" width="4.9" height="14" rx="7"/><text class="ink2" x="560" y="166" font-size="13.5" text-anchor="end">0.8 words</text><rect class="cw" x="602" y="139" width="56" height="26" rx="13"/><text class="cwt" x="630" y="157" font-size="14.5" font-weight="800" text-anchor="middle">&#8722;98%</text><text class="ink" x="36" y="203" font-size="15.5" font-weight="600">tokens written</text><rect class="bp" x="196" y="182" width="250" height="14" rx="7"/><text class="ink2" x="560" y="194" font-size="13.5" text-anchor="end">1,659 tok</text><rect class="ac" x="196" y="200" width="206.9" height="14" rx="7"/><text class="ink2" x="560" y="212" font-size="13.5" text-anchor="end">1,373 tok</text><rect class="cw" x="602" y="185" width="56" height="26" rx="13"/><text class="cwt" x="630" y="203" font-size="14.5" font-weight="800" text-anchor="middle">&#8722;17%</text><text class="ink" x="36" y="249" font-size="15.5" font-weight="600">cost per session</text><rect class="bp" x="196" y="228" width="250" height="14" rx="7"/><text class="ink2" x="560" y="240" font-size="13.5" text-anchor="end">$0.185</text><rect class="ac" x="196" y="246" width="242.5" height="14" rx="7"/><text class="ink2" x="560" y="258" font-size="13.5" text-anchor="end">$0.179</text><rect class="cf" x="602" y="231" width="56" height="26" rx="13"/><text class="cft" x="630" y="249" font-size="14.5" font-weight="800" text-anchor="middle">&#8722;3%</text><circle class="bp" cx="42" cy="288" r="5"/><text class="ink2" x="53" y="293" font-size="14" font-weight="600">no plugin</text><circle class="ac" cx="140" cy="288" r="5"/><text class="ink2" x="151" y="293" font-size="14" font-weight="600">hush</text><text class="mut" x="664" y="293" font-size="13.5" text-anchor="end">co