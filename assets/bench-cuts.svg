<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="What hush cuts, averaged per session over the same 8 jobs on Sonnet. command output: no plugin 29.3k chars, hush 13.7k chars, minus 53%. chatter while working: no plugin 52 words, hush 6 words, minus 89%. words Claude wrote: no plugin 4,896 tok, hush 4,163 tok, minus 15%. cost per session: no plugin $0.2548, hush $0.2266, minus 11%."><style>.card{fill:#fcfcfb}.card{stroke:rgba(11,11,11,.07)}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.bp{fill:#dcd9d0}.cw{fill:#e3f2e3}.cwt{fill:#0a6b0a}.cf{fill:#f0efeb}.cft{fill:#52514e}.ac{fill:#2a78d6}@media(prefers-color-scheme:dark){.card{fill:#161b22}.card{stroke:#30363d}.ink{fill:#e6edf3}.ink2{fill:#b0b8c0}.mut{fill:#9198a1}.bp{fill:#3d3c37}.cw{fill:#17301f}.cwt{fill:#3fb950}.cf{fill:#2b2b29}.cft{fill:#9198a1}.ac{fill:#4c9be8}}</style><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b0b0b" flood-opacity=".10"/></filter><rect class="card" x="8" y="6" width="684" height="304" rx="18" filter="url(#s)"/><text class="ink" x="36" y="46" font-size="21" font-weight="800">What hush cuts</text><text class="mut" x="36" y="68" font-size="14.5">average per session on the same 8 jobs &#8212; gray is no plugin, blue is hush</text><text class="ink" x="36" y="111" font-size="15.5" font-weight="600">command output</text><rect class="bp" x="196" y="90" width="250.0" height="14" rx="7"/><text class="ink2" x="560" y="102" font-size="13.5" text-anchor="end">29.3k chars</text><rect class="ac" x="196" y="108" width="117.2" height="14" rx="7"/><text class="ink2" x="560" y="120" font-size="13.5" text-anchor="end">13.7k chars</text><rect class="cw" x="602" y="93" width="56" height="26" rx="13"/><text class="cwt" x="630" y="111" font-size="14.5" font-weight="800" text-anchor="middle">−53%</text><text class="ink" x="36" y="157" font-size="15.5" font-weight="600">chatter while working</text><rect class="bp" x="196" y="136" width="250.0" height="14" rx="7"/><text class="ink2" x="560" y="148" font-size="13.5" text-anchor="end">52 words</text><rect class="ac" x="196" y="154" width="28.6" height="14" rx="7"/><text class="ink2" x="560" y="166" font-size="13.5" text-anchor="end">6 words</text><rect class="cw" x="602" y="139" width="56" height="26" rx="13"/><text class="cwt" x="630" y="157" font-size="14.5" font-weight="800" text-anchor="middle">−89%</text><text class="ink" x="36" y="203" font-size="15.5" font-weight="600">words Claude wrote</text><rect class="bp" x="196" y="182" width="250.0" height="14" rx="7"/><text class="ink2" x="560" y="194" font-size="13.5" text-anchor="end">4,896 tok</text><rect class="ac" x="196" y="200" width="212.6" height="14" rx="7"/><text class="ink2" x="560" y="212" font-size="13.5" text-anchor="end">4,163 tok</text><rect class="cw" x="602" y="185" width="56" height="26" rx="13"/><text class="cwt" x="630" y="203" font-size="14.5" font-weight="800" text-anchor="middle">−15%</text><text class="ink" x="36" y="249" font-size="15.5" font-weight="600">cost per session</text><rect class="bp" x="196" y="228" width="250.0" height="14" rx="7"/><text class="ink2" x="560" y="240" font-size="13.5" text-anchor="end">$0.2548</text><rect class="ac" x="196" y="246" width="222.3" height="14" rx="7"/><text class="ink2" x="560" y="258" font-size="13.5" text-anchor="end">$0.2266</text><rect class="cw" x="602" y="231" width="56" height="26" rx="13"/><text class="cwt" x="630" y="249" font-size="14.5" font-weight="800" text-anchor="middle">−11%</text><circle class="bp" cx="42" cy="288" r="5"/><text class="ink2" x="53" y="293" font-size="14" font-weight="600">no plugin</text><circle class="ac" cx="140" cy="288" r="5"/><text class="ink2" x="151" y="293" font-size="14" font-weight="600">hush</text><text class="mut" x="664" y="293" font-size="13.5" text-anchor="end">numbers move a few percent run to run</text></svg>