<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .title{fill:#1f2937;font-size:19px;font-weight:700}
    .sub{fill:#6b7280;font-size:13px}
    .lab{fill:#4b5563;font-size:13.5px}
    .hushlab{fill:#059669;font-size:14px;font-weight:700}
    .val{fill:#374151;font-size:14px;font-weight:600}
    .hushval{fill:#059669;font-size:15px;font-weight:700}
    .track{fill:#eef2f6}
    .base{fill:#cbd5e1}
    .brief{fill:#94a3b8}
    .hush{fill:#10b981}
    .foot{fill:#6b7280;font-size:12.5px}
    .em{fill:#059669;font-weight:700}
    .badge{fill:#10b981}
    @media (prefers-color-scheme:dark){
      .title{fill:#e6edf3}.sub{fill:#9198a1}.lab{fill:#b0b8c0}.hushlab{fill:#3fb950}
      .val{fill:#c9d1d9}.hushval{fill:#3fb950}.track{fill:#1c2128}.base{fill:#444c56}
      .brief{fill:#768390}.hush{fill:#3fb950}.foot{fill:#9198a1}.em{fill:#3fb950}.badge{fill:#238636}
    }
  </style>
  <text x="16" y="30" class="title">What a real coding session costs</text>
  <text x="16" y="52" class="sub">Average bill across the benchmark suite — measured on Sonnet, not estimated</text>

  <rect x="588" y="12" width="124" height="34" rx="17" class="badge"/>
  <text x="650" y="35" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">25% cheaper</text>

  <!-- no plugin: $0.226 (full scale) -->
  <text x="16" y="97" class="lab">no plugin</text>
  <rect x="185" y="80" width="380" height="30" rx="15" class="track"/>
  <rect x="185" y="80" width="380" height="30" rx="15" class="base"/>
  <text x="575" y="100" class="val">$0.226</text>

  <!-- be brief plugin: $0.214 -->
  <text x="16" y="143" class="lab">a &#8220;be brief&#8221; plugin</text>
  <rect x="185" y="126" width="380" height="30" rx="15" class="track"/>
  <rect x="185" y="126" width="360" height="30" rx="15" class="brief"/>
  <text x="575" y="146" class="val">$0.214</text>

  <!-- hush: $0.169 -->
  <text x="16" y="189" class="hushlab">hush</text>
  <rect x="185" y="172" width="380" height="30" rx="15" class="track"/>
  <rect x="185" y="172" width="285" height="30" rx="15" class="hush"/>
  <text x="575" y="192" class="hushval">$0.169</text>

  <text x="16" y="235" class="foot">hush trims the bill about <tspan class="em">25%</tspan> — roughly <tspan class="em">5&#215;</tspan> what a &#8220;just be brief&#8221; plugin manages (~5%).</text>
</svg>
