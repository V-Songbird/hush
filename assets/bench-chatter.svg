<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .title{fill:#1f2937;font-size:18px;font-weight:700}
    .sub{fill:#6b7280;font-size:13px}
    .sec{fill:#6b7280;font-size:12px;font-weight:700;letter-spacing:.06em}
    .lab{fill:#4b5563;font-size:13px}
    .hushlab{fill:#059669;font-size:13.5px;font-weight:700}
    .val{fill:#374151;font-size:13.5px;font-weight:600}
    .hushval{fill:#059669;font-size:14.5px;font-weight:700}
    .track{fill:#eef2f6}.base{fill:#cbd5e1}.hush{fill:#10b981}
    .foot{fill:#6b7280;font-size:12.5px}.badge{fill:#10b981}
    @media (prefers-color-scheme:dark){
      .title{fill:#e6edf3}.sub{fill:#9198a1}.sec{fill:#768390}.lab{fill:#b0b8c0}
      .hushlab{fill:#3fb950}.val{fill:#c9d1d9}.hushval{fill:#3fb950}
      .track{fill:#1c2128}.base{fill:#444c56}.hush{fill:#3fb950}
      .foot{fill:#9198a1}.badge{fill:#238636}
    }
  </style>
  <text x="16" y="30" class="title">How much you actually have to read</text>
  <text x="16" y="52" class="sub">A multi-turn session: fix a bug, ask a follow-up, write it up</text>

  <rect x="560" y="12" width="152" height="34" rx="17" class="badge"/>
  <text x="636" y="35" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">half the reading</text>

  <text x="16" y="86" class="sec">PLAY-BY-PLAY WHILE IT WORKS</text>

  <text x="16" y="111" class="lab">no plugin</text>
  <rect x="185" y="94" width="380" height="26" rx="13" class="track"/>
  <rect x="185" y="94" width="380" height="26" rx="13" class="base"/>
  <text x="575" y="112" class="val">26 words</text>

  <text x="16" y="147" class="hushlab">hush</text>
  <rect x="185" y="130" width="380" height="26" rx="13" class="track"/>
  <rect x="185" y="130" width="131" height="26" rx="13" class="hush"/>
  <text x="575" y="148" class="hushval">9 words</text>

  <text x="16" y="181" class="sec">THE REPLIES, EVERY TURN ADDED UP</text>

  <text x="16" y="206" class="lab">no plugin</text>
  <rect x="185" y="189" width="380" height="26" rx="13" class="track"/>
  <rect x="185" y="189" width="380" height="26" rx="13" class="base"/>
  <text x="575" y="207" class="val">493 words</text>

  <text x="16" y="242" class="hushlab">hush</text>
  <rect x="185" y="225" width="380" height="26" rx="13" class="track"/>
  <rect x="185" y="225" width="187" height="26" rx="13" class="hush"/>
  <text x="575" y="243" class="hushval">242 words</text>

  <text x="16" y="272" class="foot">Outcome first, one fact per line — and every job still passed its correctness check.</text>
</svg>
