<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" font-family="Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <text x="8" y="24" font-size="15" font-weight="600" fill="#8b949e">Claude hunts a real error buried in a noisy build — whole-session cost</text>
  <rect x="598" y="4" width="74" height="34" rx="17" fill="#e0653f"/>
  <text x="635" y="27" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">+30%</text>
  <rect x="210" y="46" width="342" height="28" rx="3" fill="#94a3b8"/>
  <text x="8" y="64" font-size="12.5" fill="#8b949e">no plugin</text>
  <text x="558" y="64" font-size="12" fill="#8b949e">$0.20</text>
  <rect x="210" y="84" width="380" height="28" rx="3" fill="#94a3b8"/>
  <text x="8" y="102" font-size="12.5" fill="#8b949e">Popular "be brief" plugin</text>
  <text x="596" y="102" font-size="12" fill="#8b949e">$0.22</text>
  <rect x="210" y="122" width="291" height="28" rx="3" fill="#16a34a"/>
  <text x="8" y="140" font-size="13" font-weight="700" fill="#16a34a">hush</text>
  <text x="507" y="140" font-size="13" font-weight="700" fill="#16a34a">$0.17 — 15% cheaper</text>
  <text x="8" y="172" font-size="11" fill="#8b949e">hush trims the noise before it bills you — the badge is what the brief plugin costs extra here</text>
</svg>
