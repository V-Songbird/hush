<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 727" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="The same job played twice, side by side. The prompt: The pricing suite is red and the output is a wall of text I can't read through. Can you run it, work out what's actually broken, and get it green? Without hush, Claude sends 5 messages: 4 progress notes while it works, then a 254-word write-up. With hush, nothing until the work is done, then one 42-word answer. Both sessions left the suite green. One real session each on Claude Opus 5, replayed on the recorded wall clock."><style>.card{fill:#fcfcfb;stroke:rgba(11,11,11,.07)}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.bp{fill:#dcd9d0}.ac{fill:#2a78d6}.pill{fill:#f0efeb}.pillt{fill:#52514e}.you{fill:#52514e}@media(prefers-color-scheme:dark){.card{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.ink2{fill:#b0b8c0}.mut{fill:#9198a1}.bp{fill:#3d3c37}.ac{fill:#4c9be8}.pill{fill:#2b2b29}.pillt{fill:#9198a1}.you{fill:#b0b8c0}}</style><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b0b0b" flood-opacity=".10"/></filter><rect class="card" x="8" y="6" width="684" height="715" rx="18" filter="url(#s)"/><text class="ink" x="36" y="40" font-size="21" font-weight="800">Same job, same files, both ways</text><text class="you" x="36" y="62" font-size="14" font-style="italic">you: The pricing suite is red and the output is a wall of text I can't read through. Can you run</text><text class="you" x="36" y="80" font-size="14" font-style="italic">it, work out what's actually broken, and get it green?</text><rect class="bp" x="28" y="100" width="311" height="28" rx="14"/><text class="pillt" x="183.5" y="119" font-size="15" font-weight="700" text-anchor="middle">no plugin</text><rect class="ac" x="361" y="100" width="311" height="28" rx="14"/><text class="card" x="516.5" y="119" font-size="15" font-weight="700" text-anchor="middle">hush</text><g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.474;0.492;1" dur="14s" repeatCount="indefinite"/><text class="mut" x="377" y="154" font-size="13.5" font-style="italic">working, quietly</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.114;0.132;1" dur="14s" repeatCount="indefinite"/><circle class="bp" cx="33" cy="150" r="4"/><text class="ink" x="44" y="154" font-size="13.5">I'll start by looking at the project structure</text><text class="ink" x="44" y="172" font-size="13.5">and finding the pricing suite.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.229;0.246;1" dur="14s" repeatCount="indefinite"/><circle class="bp" cx="33" cy="196" r="4"/><text class="ink" x="44" y="200" font-size="13.5">src/pricing.js requires ./tiers.js — let me</text><text class="ink" x="44" y="218" font-size="13.5">check what's in src and run the suite,</text><text class="ink" x="44" y="236" font-size="13.5">filtering to just the failure detail.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.343;0.361;1" dur="14s" repeatCount="indefinite"/><circle class="bp" cx="33" cy="260" r="4"/><text class="ink" x="44" y="264" font-size="13.5">All 622 other cases pass; the 3 failures are</text><text class="ink" x="44" y="282" font-size="13.5">all orderTotal. The bug is real and confined</text><text class="ink" x="44" y="300" font-size="13.5">to one line — src/pricing.js:41 computes tax</text><text class="ink" x="44" y="318" font-size="13.5">on the pre-discount cents, contradicting the</text><text class="ink" x="44" y="336" font-size="13.5">function's own doc comment (&quot;tax what's</text><text class="ink" x="44" y="354" font-size="13.5">actually owed&quot;).</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.457;0.475;1" dur="14s" repeatCount="indefinite"/><circle class="bp" cx="33" cy="378" r="4"/><text class="ink" x="44" y="382" font-size="13.5">Using the existing applyTax helper reads</text><text class="ink" x="44" y="400" font-size="13.5">better here:</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.571;0.589;1" dur="14s" repeatCount="indefinite"/><circle class="bp" cx="33" cy="424" r="4"/><text class="ink" x="44" y="428" font-size="13.5">Green: 625 total, 625 passing, 0 failing, exit</text><text class="ink" x="44" y="446" font-size="13.5">0.</text><text class="ink" x="44" y="473" font-size="13.5" font-weight="700">What was actually broken</text><text class="ink" x="44" y="500" font-size="13.5">Only 3 of the 625 cases failed, all in the</text><text class="ink" x="44" y="518" font-size="13.5">order totals suite, all one root cause in</text><text class="ink" x="44" y="536" font-size="13.5">orderTotal (src/pricing.js:39):</text><text class="ink2" x="44" y="563" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">const discounted = applyDiscount(cents,</text><text class="ink2" x="44" y="581" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">    discountPct);</text><text class="ink2" x="44" y="599" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">const tax = roundCents(cents * taxRate);</text><text class="ink2" x="44" y="617" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">    // ← tax on the PRE-discount amount</text><text class="ink2" x="44" y="635" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">return discounted + tax;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.571;0.589;1" dur="14s" repeatCount="indefinite"/><text class="mut" x="44" y="653" font-size="13.5">…and on. 254 words in all.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.474;0.492;1" dur="14s" repeatCount="indefinite"/><circle class="ac" cx="366" cy="150" r="4"/><text class="ink" x="377" y="154" font-size="13.5" font-weight="700">Green. 625 passing, 0 failing.</text><text class="ink" x="377" y="181" font-size="13.5">One bug, in orderTotal. It taxed the full</text><text class="ink" x="377" y="199" font-size="13.5">price, not the discounted price.</text><text class="ink" x="377" y="226" font-size="13.5">Only 3 of 625 cases had both a discount and a</text><text class="ink" x="377" y="244" font-size="13.5">tax. Those 3 failed.</text><text class="ink" x="377" y="271" font-size="13.5">Fix at src/pricing.js:39: tax the discounted</text><text class="ink" x="377" y="289" font-size="13.5">amount.</text><text class="ink" x="377" y="316" font-size="13.5">Next: nothing.</text></g><text class="mut" x="36" y="705" font-size="13.5">one real session each, Claude Opus 5 · replayed on the recorded clock · both finished green</text></svg>