<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 527" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="The same job played twice, side by side. The prompt: The pricing suite is red and the output is a wall of text I can't read through. Can you run it, work out what's actually broken, and get it green? Without hush, Claude sends 3 messages: 2 progress notes while it works, then a 179-word answer. With hush, nothing until the work is done, then one 206-word answer. Both sessions left the suite green. One real session each on Claude Opus 5.5, paced by its recorded wall-clock time."><style>.card{fill:#fcfcfb;stroke:rgba(11,11,11,.07)}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.bp{fill:#dcd9d0}.ac{fill:#2c75a5}.pill{fill:#f0efeb}.pillt{fill:#52514e}.you{fill:#52514e}@media(prefers-color-scheme:dark){.card{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.ink2{fill:#b0b8c0}.mut{fill:#9198a1}.bp{fill:#3d3c37}.ac{fill:#79b6de}.pill{fill:#2b2b29}.pillt{fill:#9198a1}.you{fill:#b0b8c0}}.card,.bg{fill:#fff}.ink-frame{stroke:#252820;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.seal{stroke:#252820}.seal-paper{fill:#fff}text{font-kerning:normal;text-rendering:optimizeLegibility}@media(prefers-color-scheme:dark){.card,.bg{fill:#191c1b}.ink-frame{stroke:#eee9de}.seal{stroke:#eee9de}.seal-paper{fill:#191c1b}}@media(prefers-reduced-motion:reduce){g:has(>animate[values$=";1"]){opacity:1!important}g:has(>animate[values$=";0"]){opacity:0!important}}</style><path class="card ink-frame" d="M20 7 Q254.23999999999998 4 680 7 Q691 6 691 18 L690 509 Q692 520 680 520 Q336.32 523 20 520 Q9 521 9 509 L10 18 Q8 7 20 7Z"/><text class="ink" x="36" y="40" font-size="21" font-weight="800">Same job, same files, both ways</text><text class="you" x="36" y="62" font-size="14" font-style="italic">you: The pricing suite is red and the output is a wall of text I can't read through. Can you run</text><text class="you" x="36" y="80" font-size="14" font-style="italic">it, work out what's actually broken, and get it green?</text><path class="bp ink-frame" d="M37.333333333333336 101 Q139.95999999999998 98.6 329.6666666666667 101 Q338 100 338 109.33333333333333 L337 118.66666666666667 Q339 127 329.6666666666667 127 Q177.28 129.4 37.333333333333336 127 Q29 128 29 118.66666666666667 L30 109.33333333333333 Q28 101 37.333333333333336 101Z"/><text class="pillt" x="183.5" y="119" font-size="15" font-weight="700" text-anchor="middle">no plugin</text><path class="ac ink-frame" d="M370.3333333333333 101 Q472.96 98.6 662.6666666666666 101 Q671 100 671 109.33333333333333 L670 118.66666666666667 Q672 127 662.6666666666666 127 Q510.28 129.4 370.3333333333333 127 Q362 128 362 118.66666666666667 L363 109.33333333333333 Q361 101 370.3333333333333 101Z"/><text class="card" x="516.5" y="119" font-size="15" font-weight="700" text-anchor="middle">hush</text><g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.571;0.589;1" dur="14s" repeatCount="indefinite"/><text class="mut" x="377" y="154" font-size="13.5" font-style="italic">working, quietly</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.183;0.201;1" dur="14s" repeatCount="indefinite"/><circle class="bp" cx="33" cy="150" r="4"/><text class="ink" x="44" y="154" font-size="13.5">The orderTotal bug is visible already; let me</text><text class="ink" x="44" y="172" font-size="13.5">run to confirm it's the only failure.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.366;0.384;1" dur="14s" repeatCount="indefinite"/><circle class="bp" cx="33" cy="196" r="4"/><text class="ink" x="44" y="200" font-size="13.5">Exactly as expected: orderTotal taxes the</text><text class="ink" x="44" y="218" font-size="13.5">pre-discount amount, contradicting its own doc</text><text class="ink" x="44" y="236" font-size="13.5">comment.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.549;0.566;1" dur="14s" repeatCount="indefinite"/><circle class="bp" cx="33" cy="260" r="4"/><text class="ink" x="44" y="264" font-size="13.5">The suite is green now: all 625 tests pass and</text><text class="ink" x="44" y="282" font-size="13.5">the run exits 0.</text><text class="ink" x="44" y="309" font-size="13.5">What was broken: there was one bug, and it</text><text class="ink" x="44" y="327" font-size="13.5">caused all 3 failures (tests 433–435 in &quot;order</text><text class="ink" x="44" y="345" font-size="13.5">totals&quot;). In src/pricing.js, orderTotal took</text><text class="ink" x="44" y="363" font-size="13.5">the discount off the price but then charged</text><text class="ink" x="44" y="381" font-size="13.5">tax on the full, pre-discount price. Its own</text><text class="ink" x="44" y="399" font-size="13.5">comment says tax should be charged on the</text><text class="ink" x="44" y="417" font-size="13.5">discounted amount, which is also what the spec</text><text class="ink" x="44" y="435" font-size="13.5">in cases.js expects. So customers were being</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.549;0.566;1" dur="14s" repeatCount="indefinite"/><text class="mut" x="44" y="453" font-size="13.5">…and on. 179 words in all.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.571;0.589;1" dur="14s" repeatCount="indefinite"/><circle class="ac" cx="366" cy="150" r="4"/><text class="ink" x="377" y="154" font-size="13.5" font-weight="700">The pricing suite passes now. One bug in</text><text class="ink" x="377" y="172" font-size="13.5" font-weight="700">orderTotal broke three tests.</text><text class="ink" x="377" y="199" font-size="13.5">orderTotal worked out tax on the full price,</text><text class="ink" x="377" y="217" font-size="13.5">not the discounted price. Its own comment says</text><text class="ink" x="377" y="235" font-size="13.5">tax goes on what the customer pays. I changed</text><text class="ink" x="377" y="253" font-size="13.5">one line, src/pricing.js:41, from cents *</text><text class="ink" x="377" y="271" font-size="13.5">taxRate to discounted * taxRate.</text><text class="ink" x="377" y="298" font-size="13.5">All three failures were in the &quot;order totals&quot;</text><text class="ink" x="377" y="316" font-size="13.5">suite:</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.571;0.589;1" dur="14s" repeatCount="indefinite"/><text class="mut" x="377" y="334" font-size="13.5">…and on. 206 words in all.</text></g><text class="mut" x="36" y="505" font-size="13.5">one real session each, Claude Opus 5.5 · paced by the recorded clock · both finished green</text><g transform="translate(655 38) rotate(-6) translate(-20 -20) scale(0.3125)" aria-hidden="true"><g class="seal" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M64 15Q100 14 111 43Q118 70 102 94Q86 114 60 112Q30 112 19 88Q10 62 22 38Q36 16 64 15Z" fill="#2c75a5"/><path d="M79 38A30 30 0 1 0 91 88A24 24 0 1 1 79 38Z" class="seal-paper"/></g></g></svg>