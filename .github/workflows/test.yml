name: Main documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the documentation-only main tree
        env:
          PLUGIN: ${{ github.event.repository.name }}
        run: node .github/check-main-frontpage.cjs --repo . --plugin "$PLUGIN" --ref HEAD
