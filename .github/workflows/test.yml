name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve committed line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Manifest and hook registration parse
        run: node -e 'for (const f of [".claude-plugin/plugin.json","hooks/hooks.json"]) JSON.parse(require("fs").readFileSync(f,"utf-8"))'

      - name: No benchmark tree in the package
        run: |
          if git ls-files | grep -iE '^\.?benchmarks/'; then
            echo "benchmark harnesses belong in Foundry, not in the plugin"
            exit 1
          fi

      - name: README navigation
        run: node scripts/git-hooks/check-readme-nav.js README.md

      - name: Tests
        run: node --test tests/*.test.js

  test:
    name: test
    needs: [suite]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every suite run to pass
        env:
          RESULT: ${{ needs.suite.result }}
        run: test "$RESULT" = success
