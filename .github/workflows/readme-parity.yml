name: README coordination

on:
  push:
    branches: [Claude, Codex]
  pull_request:
    branches: [Claude, Codex]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  readme-contract:
    name: README contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/git-hooks/check-readme-parity.test.js scripts/git-hooks/check-readme-candidate.test.js
      - name: Validate this edition and its benchmark declaration
        env:
          PLATFORM: ${{ github.base_ref || github.ref_name }}
        run: node scripts/git-hooks/check-readme-parity.js --check README.md --expect "$PLATFORM"
      - name: Compare the coordinated candidate or integrated peer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/git-hooks/check-readme-candidate.js
